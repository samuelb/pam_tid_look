# git-cliff configuration (https://git-cliff.org). The release workflow
# (.github/workflows/release.yml) uses it to compute the next version from the
# commits since the last tag and to write the release notes.
#
# Commits follow Conventional Commits (feat:, fix:, docs:, refactor:, perf:,
# test:, chore:, ci:, build:). Others land in "Other" rather than being
# dropped. Before 1.0.0, feat: bumps the minor version and fix: the patch
# version; a breaking change (feat!: or BREAKING CHANGE:) bumps the major one.
#
# Follows cliff.toml in https://github.com/samuelb/somad.

[changelog]
header = "## Changes\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}\
{% endfor %}
{% if previous.version %}\
**Full Changelog**: https://github.com/samuelb/pam_tid_look/compare/{{ previous.version }}...{{ version }}
{% endif %}\
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "newest"
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^(build|ci|chore)", group = "<!-- 6 -->Miscellaneous" },
  { message = ".*", group = "<!-- 7 -->Other" },
]

[bump]
# The version of the first release, when no tag exists yet.
initial_tag = "v0.1.0"
